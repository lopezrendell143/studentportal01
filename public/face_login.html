<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facial Recognition Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f5f6fa; font-family: 'Inter', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 450px; text-align: center; }
        .camera-box { position: relative; width: 320px; height: 240px; margin: 20px auto; background: #000; border-radius: 15px; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="fw-bold mb-1"><i class="fas fa-user-shield text-primary me-2"></i>Face Login</h3>
    <p class="text-muted small">Look into your camera to verify your student identity.</p>

    <div class="camera-box">
        <video id="video" autoplay muted playsinline></video>
    </div>

    <div id="status" class="alert alert-info py-2 small">Loading AI Models...</div>
    
    <a href="login.html" class="btn btn-link btn-sm text-decoration-none mt-2 text-muted">
        <i class="fas fa-arrow-left me-1"></i> Standard Login
    </a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>
    // 1. Initialize Firebase database with the correct database path
    const firebaseConfig = {
        databaseURL: "https://studentportal-fc3a9-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    
    // FIX 1: Updated the database reference with your actual Secret Auth token seen in firebase_helper.php
    const db = firebase.database().app.database("https://studentportal-fc3a9-default-rtdb.asia-southeast1.firebasedatabase.app/?auth=LorrhK8Tnsbziwce0NNjpDNZcpTUoECPdiLcaZkQ");

    const video = document.getElementById('video');
    const statusText = document.getElementById('status');
    let registeredUsers = {};

    // 2. Load Models locally from your assets folder
    async function init() {
        try {
            statusText.innerText = "Loading AI Models...";
            
            // FIX 2: Removed the leading '.' so Firebase Hosting resolves the model paths smoothly from root
            await faceapi.nets.ssdMobilenetv1.loadFromUri('/assets/models/');
            await faceapi.nets.faceLandmark68Net.loadFromUri('/assets/models/');
            await faceapi.nets.faceRecognitionNet.loadFromUri('/assets/models/');

            statusText.innerText = "Fetching student keys...";
            
            // FIX 3: Changed 'users' to capitalized 'Users' to match your actual Firebase path layout
            db.ref('Users').once('value', (snapshot) => {
                registeredUsers = snapshot.val() || {};
                startVideo();
            });
        } catch (e) {
            console.error(e);
            statusText.innerText = "Error loading models. Verify shard files exist in assets/models/.";
            statusText.className = "alert alert-danger py-2 small";
        }
    }

    function startVideo() {
        navigator.mediaDevices.getUserMedia({ video: {} })
            .then(stream => {
                video.srcObject = stream;
                statusText.innerText = "System Ready! Scanning face...";
                statusText.className = "alert alert-success py-2 small";
                
                setInterval(checkFaceSignature, 2500);
            })
            .catch(err => {
                statusText.innerText = "Camera Error: " + err;
                statusText.className = "alert alert-danger py-2 small";
            });
    }

    async function checkFaceSignature() {
        const detection = await faceapi.detectSingleFace(video)
            .withFaceLandmarks()
            .withFaceDescriptor();

        if (!detection) return; 

        const currentDescriptor = detection.descriptor;

        for (const userId in registeredUsers) {
            const user = registeredUsers[userId];
            
            if (user && user.face_descriptor) {
                const savedDescriptorArray = new Float32Array(user.face_descriptor.split(','));
                const distance = faceapi.euclideanDistance(currentDescriptor, savedDescriptorArray);

                if (distance < 0.55) {
                    statusText.innerText = "Match Verified! Logging in...";
                    statusText.className = "alert alert-success py-2 small fw-bold";
                    
                    window.location.href = `../includes/biometric_handler.php?token=${encodeURIComponent(userId)}&auth_type=face`;
                    return;
                }
            }
        }
    }

    window.onload = init;
</script>
</body>
</html>
