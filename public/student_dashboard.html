<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">

    <script>
        if (localStorage.getItem('user_role') !== 'student') {
            window.location.href = 'index.html';
        }
    </script>

    <div class="max-w-4xl mx-auto p-8">
        <div class="bg-white rounded-2xl p-8 shadow-md border border-slate-100 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Welcome back, <span id="student-name">Student</span>!</h1>
                <p class="text-slate-500 mt-1">Logged in via Student Portal HTML Workspace</p>
            </div>
            <button onclick="logout()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition-colors">
                Log Out
            </button>
        </div>
    </div>

    <script>
        document.getElementById('student-name').textContent = localStorage.getItem('user_name') || 'Student';
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
