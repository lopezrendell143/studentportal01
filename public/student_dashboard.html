<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard & Exam Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">

    <script>
        if (localStorage.getItem('user_role') !== 'student') {
            window.location.href = 'index.html';
        }
    </script>

    <div class="max-w-5xl mx-auto p-6">
        <header class="bg-white rounded-2xl p-6 shadow-md border border-slate-100 flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Welcome back, <span id="student-name">Student</span>!</h1>
                <p class="text-slate-500 text-sm mt-1">Student Portal Active Exam Terminal Session</p>
            </div>
            <button onclick="logout()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition-colors">
                Log Out
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
                <h3 class="text-lg font-bold text-slate-800 mb-3">Available Examinations</h3>
                <p class="text-xs text-slate-400 mb-4">Pick a live test node key row below to initialize your secure session:</p>
                <div id="exam-list" class="space-y-2">
                    </div>
            </div>

            <div class="lg:col-span-2 bg-white p-8 rounded-2xl shadow-sm border border-slate-200 min-h-[400px] flex flex-col justify-between" id="exam-terminal-desk">
                <div class="text-center my-auto text-slate-400" id="empty-state-notice">
                    <p class="text-lg font-medium">No Examination Loaded</p>
                    <p class="text-xs mt-1">Select an active exam container from the left tray deck to begin.</p>
                </div>
                
                <div id="active-exam-container" class="hidden h-full flex flex-col justify-between space-y-6">
                    <div class="flex justify-between items-center border-b pb-4 border-slate-100">
                        <h2 class="text-xl font-bold text-slate-800" id="live-exam-title">Exam</h2>
                        <div class="bg-red-50 border border-red-100 px-4 py-1.5 rounded-full text-red-600 font-mono font-bold text-sm flex items-center gap-1.5 animate-pulse">
                            ⏱️ <span id="timer-countdown">00:00</span>
                        </div>
                    </div>

                    <div class="space-y-4 my-4">
                        <p class="text-base font-semibold text-slate-800 bg-slate-50 p-4 rounded-xl border border-slate-100" id="live-question-text"></p>
                        <div class="grid grid-cols-1 gap-3" id="live-choices-deck">
                            </div>
                    </div>

                    <button onclick="submitExam(false)" id="submit-exam-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition-all shadow-lg shadow-indigo-100 text-sm">
                        Finalize & Submit Answers
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('student-name').textContent = localStorage.getItem('user_name') || 'Student';
        const databaseRoot = "https://studentportal01-9ddef-default-rtdb.asia-southeast1.firebasedatabase.app";
        
        let localExamsObject = {};
        let currentLoadedExamId = "";
        let countdownTimerReference = null;
        let selectedAnswers = "";

        // Query Available Tests
        async function fetchAvailableExams() {
            const tray = document.getElementById('exam-list');
            tray.innerHTML = '<p class="text-sm text-slate-400 text-center py-2">Polling database nodes...</p>';
            try {
                const response = await fetch(`${databaseRoot}/Exams.json`);
                localExamsObject = await response.json() || {};
                tray.innerHTML = '';
                
                if (Object.keys(localExamsObject).length > 0) {
                    for (const id of Object.keys(localExamsObject)) {
                        tray.innerHTML += `
                            <button onclick="startExamSession('${id}')" class="w-full text-left p-3.5 rounded-xl border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/20 text-slate-700 font-medium text-sm transition-all flex justify-between items-center">
                                <span>📝 ${id}</span>
                                <span class="text-xs bg-slate-100 px-2 py-1 rounded text-slate-500">${localExamsObject[id].duration_minutes}m</span>
                            </button>
                        `;
                    }
                } else { tray.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">No tests deployed by admin.</p>'; }
            } catch (e) { tray.innerHTML = '<p class="text-xs text-red-500">Syncing failed.</p>'; }
        }

        // Initialize exam environment and countdown timers
        function startExamSession(examId) {
            clearInterval(countdownTimerReference);
            currentLoadedExamId = examId;
            const targetExam = localExamsObject[examId];

            document.getElementById('empty-state-notice').classList.add('hidden');
            document.getElementById('active-exam-container').classList.remove('hidden');
            document.getElementById('live-exam-title').textContent = `Exam: ${examId}`;
            document.getElementById('live-question-text').textContent = targetExam.question;
            document.getElementById('submit-exam-btn').disabled = false;
            document.getElementById('submit-exam-btn').className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition-all shadow-lg text-sm";

            // Render Radio Inputs Choice Cards
            const choicesDeck = document.getElementById('live-choices-deck');
            choicesDeck.innerHTML = '';
            for (const [key, text] of Object.entries(targetExam.choices)) {
                choicesDeck.innerHTML += `
                    <label class="flex items-center gap-3 p-3.5 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50/50 transition-colors">
                        <input type="radio" name="quiz-choice" value="${key}" onclick="selectedAnswers = '${key}'" class="w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-500">
                        <span class="text-sm font-semibold text-slate-500">${key}.</span>
                        <span class="text-sm text-slate-700 font-medium">${text}</span>
                    </label>
                `;
            }

            // Start Live Countdown Core Loop
            let remainingSeconds = targetExam.duration_minutes * 60;
            updateClockDisplay(remainingSeconds);

            countdownTimerReference = setInterval(() => {
                remainingSeconds--;
                updateClockDisplay(remainingSeconds);
                if (remainingSeconds <= 0) {
                    clearInterval(countdownTimerReference);
                    alert("Time is up! Your answer is submitting automatically.");
                    submitExam(true); // Forced automation submission
                }
            }, 1000);
        }

        function updateClockDisplay(seconds) {
            const display = document.getElementById('timer-countdown');
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            display.textContent = `${mins}:${secs}`;
        }

        // Score check evaluation and push to Firebase Results Node
        async function submitExam(isForcedByTimeout = false) {
            clearInterval(countdownTimerReference);
            const targetExam = localExamsObject[currentLoadedExamId];
            
            let finalCalculatedScore = 0;
            if (selectedAnswers === targetExam.correct_answer) {
                finalCalculatedScore = 1;
            }

            const cleanSafeEmailKey = (localStorage.getItem('user_email') || 'unknown').replace(/[\.@]/g, '_');
            const submissionPayload = {
                student_name: localStorage.getItem('user_name') || 'Student',
                exam_taken: currentLoadedExamId,
                selected_answer: selectedAnswers || 'No Answer Given',
                score: finalCalculatedScore,
                total_questions: 1,
                submitted_at: new Date().toLocaleString()
            };

            try {
                // Save directly to Firebase Realtime Database
                await fetch(`${databaseRoot}/Results/${cleanSafeEmailKey}_${currentLoadedExamId}.json`, {
                    method: 'PUT',
                    body: JSON.stringify(submissionPayload)
                });

                // Lock workspace display to confirm grade save safely
                document.getElementById('live-choices-deck').innerHTML = `
                    <div class="bg-indigo-50/50 border border-indigo-100 p-6 rounded-2xl text-center space-y-2">
                        <p class="text-2xl font-bold text-indigo-600">Exam Concluded 🎉</p>
                        <p class="text-sm text-slate-600 font-medium">Your score has been successfully saved to your profile tree node!</p>
                        <div class="text-lg font-bold text-slate-700 pt-2">Your Score: ${finalCalculatedScore} / 1</div>
                    </div>
                `;
                document.getElementById('submit-exam-btn').disabled = true;
                document.getElementById('submit-exam-btn').className = "w-full bg-slate-300 text-slate-500 font-medium py-3 rounded-xl cursor-not-allowed text-sm";
            } catch (err) { alert("Failed to log results with cloud data network."); }
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        fetchAvailableExams();
    </script>
</body>
</html>
