<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Student Portal</h1>
            <p class="text-slate-500 mt-2">Sign in to your account</p>
        </div>

        <div id="error-box" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center mb-5 border border-red-100"></div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                <input type="email" id="email" required placeholder="JuanTamad@gmail.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-lg shadow-indigo-100">
                Sign In
            </button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('error-box');
            
            errorBox.classList.add('hidden');

            // Determine the Firebase key mapping
            let userNode = "";
            if (emailInput === "admin@gmail.com") {
                userNode = "admin01";
            } else if (emailInput === "rendell@gmail.com") {
                userNode = "student01";
            } else {
                // Matches the auto-generated structure for newly created students
                userNode = "student_" + emailInput.replace(/[\.@]/g, '_');
            }

            // Your exact Singapore database URL targeting the specific node
            const url = `https://studentportal01-9ddef-default-rtdb.asia-southeast1.firebasedatabase.app/Users/${userNode}.json`;

            try {
                const response = await fetch(url);
                const userData = await response.json();

                if (userData && userData.password === passwordInput) {
                    // Store user session variables locally in the browser
                    localStorage.setItem('user_email', emailInput);
                    localStorage.setItem('user_name', userData['Full name'] || userData['name'] || "User");
                    
                    // Route user roles based on node signature
                    if (userNode.includes('admin')) {
                        localStorage.setItem('user_role', 'admin');
                        window.location.href = 'admin_dashboard.html';
                    } else {
                        localStorage.setItem('user_role', 'student');
                        window.location.href = 'student_dashboard.html';
                    }
                } else {
                    errorBox.textContent = "Invalid email or password.";
                    errorBox.classList.remove('hidden');
                }
            } catch (error) {
                errorBox.textContent = "Error connecting to Firebase Realtime Database.";
                errorBox.classList.remove('hidden');
                console.error(error);
            }
        });
    </script>

    <div class="mt-4 pt-4 border-t border-slate-100">
    <button onclick="openFaceLoginModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl text-sm transition-all shadow-md flex items-center justify-center gap-2">
        📸 Fast Login with Face Scan
    </button>
</div>

<div id="face-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-100 flex flex-col">
        <div class="bg-emerald-600 p-4 text-white flex justify-between items-center">
            <h3 class="font-bold text-sm tracking-wide flex items-center gap-2">🔮 Scanner Identity Terminal</h3>
            <button onclick="closeFaceLoginModal()" class="text-white/80 hover:text-white font-bold text-lg">✕</button>
        </div>
        <div class="p-6 flex flex-col items-center text-center space-y-4">
            <div class="relative w-full aspect-square bg-slate-950 rounded-xl overflow-hidden border-2 border-emerald-500 shadow-inner max-w-[280px]">
                <video id="login-webcam" autoplay muted playsinline class="w-full h-full object-cover"></video>
                <div class="absolute inset-x-0 h-0.5 bg-emerald-400 opacity-70 shadow-[0_0_8px_#34d399] animate-[bounce_2s_infinite]"></div>
            </div>
            <div>
                <p id="login-status-label" class="text-sm font-bold text-slate-700">Warming up scanning hardware...</p>
                <p class="text-xs text-slate-400 mt-0.5">Position your face in the camera viewport array frame.</p>
            </div>
        </div>
    </div>
</div>

<script>
    const dbRoot = "https://studentportal01-9ddef-default-rtdb.asia-southeast1.firebasedatabase.app";
    // Defer loading tracking dependencies dynamically to avoid slowing down page initialization loads
    let faceApiLoaded = false;
    let loginStreamInstance = null;

    function loadFaceApiScripts() {
        if (faceApiLoaded) return Promise.resolve();
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js";
            script.onload = () => {
                faceApiLoaded = true;
                resolve();
            };
            script.onerror = reject;
            document.head.appendChild(script);
        });
    }

   async function openFaceLoginModal() {
    document.getElementById('face-modal').classList.remove('hidden');
    const label = document.getElementById('login-status-label');
    
    try {
        await loadFaceApiScripts();
        label.textContent = "Syncing network nodes models...";
        
        // 🚀 FIXED: Mirror matched route updates
        const MODEL_URL = 'https://cdn.jsdelivr.net/gh/carlosrodriguez88/face-api.js@master/weights/';
        
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        
        label.textContent = "Booting optics camera sensors...";
        loginStreamInstance = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById('login-webcam').srcObject = loginStreamInstance;
        
        label.textContent = "Scanning... Hold still";
        runBiometricMatchLoop();
    } catch (e) {
        console.error(e);
        alert(`Optics scanner failure: ${e.message}`);
        closeFaceLoginModal();
    }
}

    async function runBiometricMatchLoop() {
    const videoElement = document.getElementById('login-webcam');
    const label = document.getElementById('login-status-label');
    
    if (!loginStreamInstance) return;

    const snapshot = await faceapi.detectSingleFace(videoElement)
        .withFaceLandmarks()
        .withFaceDescriptor();

    if (snapshot) {
        label.textContent = "Comparing face signature against global records...";
        
        try {
            const response = await fetch(`${dbRoot}/Users.json`);
            const userTree = await response.json() || {};
            
            let bestMatchUser = null;
            let lowestDistanceThreshold = 0.6; // Distances under 0.6 match profiles
            let totalRegisteredFaces = 0;

            for (const [nodeId, userProfile] of Object.entries(userTree)) {
                if (userProfile.face_signature) {
                    totalRegisteredFaces++;
                    const savedSignatureVector = new Float32Array(userProfile.face_signature);
                    const structuralDistance = faceapi.euclideanDistance(snapshot.descriptor, savedSignatureVector);
                    
                    if (structuralDistance < lowestDistanceThreshold) {
                        lowestDistanceThreshold = structuralDistance;
                        bestMatchUser = {
                            uid: nodeId,
                            name: userProfile["Full name"] || "User",
                            role: userProfile.role || "student",
                            email: userProfile.email || 'N/A'
                        };
                    }
                }
            }

            // 💡 FIX HERE: Inform them immediately if nobody has registered biometrics yet
            if (totalRegisteredFaces === 0) {
                label.innerHTML = `<span class="text-red-500 font-semibold">❌ No biometric records found. Please sign in with your password first and register your face!</span>`;
                return; 
            }

            if (bestMatchUser) {
                label.textContent = `Match Found! Welcome ${bestMatchUser.name}`;
                localStorage.setItem('user_role', bestMatchUser.role);
                localStorage.setItem('user_name', bestMatchUser.name);
                localStorage.setItem('user_email', bestMatchUser.email);
                
                setTimeout(() => {
                    closeFaceLoginModal();
                    if (bestMatchUser.role === 'admin') window.location.href = 'admin_dashboard.html';
                    else window.location.href = 'student_dashboard.html';
                }, 1000);
                return;
            } else {
                // Face detected but doesn't match any registered user signatures
                label.innerHTML = `<span class="text-amber-600 font-semibold">🔍 Face not recognized. Make sure you are registered or try adjusting your lighting.</span>`;
            }
        } catch (err) { console.error("Database mismatch execution cross checks dropped:", err); }
    }

    // Keep loop active
    setTimeout(() => {
        if (loginStreamInstance) runBiometricMatchLoop();
    }, 700);
}

    function closeFaceLoginModal() {
        if (loginStreamInstance) {
            loginStreamInstance.getTracks().forEach(track => track.stop());
            loginStreamInstance = null;
        }
        document.getElementById('face-modal').classList.add('hidden');
    }
</script>
</body>
</html>
