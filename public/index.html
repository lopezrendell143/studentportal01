<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Modern aesthetic enhancements using regular CSS */
        body {
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                linear-gradient(to bottom right, #f8fafc, #e2e8f0);
            background-attachment: fixed;
        }

        /* Glassmorphism card refinement */
        .auth-card {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.05), 
                0 20px 25px -5px rgba(0, 0, 0, 0.05),
                inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }

        /* Header Accent */
        .portal-header::before {
            content: "🎓";
            display: block;
            font-size: 2rem;
            margin-bottom: 0.75rem;
            filter: drop-shadow(0 4px 6px rgba(99, 102, 241, 0.2));
        }

        /* Form input enhancements */
        input[type="email"], input[type="password"] {
            background-color: rgba(248, 250, 252, 0.7) !important;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        input[type="email"]:focus, input[type="password"]:focus {
            background-color: #ffffff !important;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15) !important;
            transform: translateY(-1px);
        }

        /* Button micro-interactions */
        button[type="submit"] {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%) !important;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25) !important;
        }

        button[type="submit"]:hover {
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35) !important;
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        button[type="submit"]:active {
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.2) !important;
        }

        /* Labels styling */
        label {
            font-size: 0.75rem !important;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600 !important;
            color: #475569 !important;
        }

        /* Error box attention grabber */
        #error-box {
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.08);
        }

        @keyframes slideIn {
            from { transform: translateY(-8px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100 auth-card">
        <div class="text-center mb-8 portal-header">
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Student Portal</h1>
            <p class="text-slate-500 mt-2">Sign in to your account</p>
        </div>

        <div id="error-box" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center mb-5 border border-red-100"></div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                <input type="email" id="email" required placeholder="JuanTamad@gmail.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-lg shadow-indigo-100">
                Sign In
            </button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('error-box');
            
            errorBox.classList.add('hidden');

            // Determine the Firebase key mapping
            let userNode = "";
            if (emailInput === "admin@gmail.com") {
                userNode = "admin01";
            } else if (emailInput === "rendell@gmail.com") {
                userNode = "student01";
            } else {
                // Matches the auto-generated structure for newly created students
                userNode = "student_" + emailInput.replace(/[\.@]/g, '_');
            }

            // Your exact Singapore database URL targeting the specific node
            const url = `https://studentportal01-9ddef-default-rtdb.asia-southeast1.firebasedatabase.app/Users/${userNode}.json`;

            try {
                const response = await fetch(url);
                const userData = await response.json();

                if (userData && userData.password === passwordInput) {
                    // Store user session variables locally in the browser
                    localStorage.setItem('user_email', emailInput);
                    localStorage.setItem('user_name', userData['Full name'] || userData['name'] || "User");
                    
                    // Route user roles based on node signature
                    if (userNode.includes('admin')) {
                        localStorage.setItem('user_role', 'admin');
                        window.location.href = 'admin_dashboard.html';
                    } else {
                        localStorage.setItem('user_role', 'student');
                        window.location.href = 'student_dashboard.html';
                    }
                } else {
                    errorBox.textContent = "Invalid email or password.";
                    errorBox.classList.remove('hidden');
                }
            } catch (error) {
                errorBox.textContent = "Error connecting to Firebase Realtime Database.";
                errorBox.classList.remove('hidden');
                console.error(error);
            }
        });
    </script>

    
</body>
</html>
