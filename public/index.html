<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                linear-gradient(to bottom right, #f8fafc, #e2e8f0);
            background-attachment: fixed;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.05), 
                0 20px 25px -5px rgba(0, 0, 0, 0.05),
                inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }

        .portal-header::before {
            content: "🎓";
            display: block;
            font-size: 2rem;
            margin-bottom: 0.75rem;
            filter: drop-shadow(0 4px 6px rgba(99, 102, 241, 0.2));
        }

        input[type="email"], input[type="password"] {
            background-color: rgba(248, 250, 252, 0.7) !important;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        input[type="email"]:focus, input[type="password"]:focus {
            background-color: #ffffff !important;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15) !important;
            transform: translateY(-1px);
        }

        button {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        button.btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%) !important;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25) !important;
        }

        button.btn-primary:hover {
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35) !important;
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        label {
            font-size: 0.75rem !important;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600 !important;
            color: #475569 !important;
        }

        #error-box, #status-box {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(-8px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100 auth-card">
        <div class="text-center mb-6 portal-header">
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Student Portal</h1>
            <p class="text-slate-500 mt-1">Sign in to your account</p>
        </div>

        <div class="flex p-1 bg-slate-100 rounded-xl mb-6 text-sm font-medium">
            <button id="tab-pass" class="w-full py-2 rounded-lg text-indigo-600 bg-white shadow-sm" onclick="switchMode('pass')">
                <i class="fas fa-keyboard me-1"></i> Password
            </button>
            <button id="tab-face" class="w-full py-2 rounded-lg text-slate-600 hover:text-slate-900" onclick="switchMode('face')">
                <i class="fas fa-face-recognition me-1"></i> Face ID
            </button>
        </div>

        <div id="error-box" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center mb-5 border border-red-100"></div>
        <div id="status-box" class="hidden bg-indigo-50 text-indigo-600 p-3 rounded-lg text-sm text-center mb-5 border border-indigo-100">
            <i class="fas fa-circle-notch fa-spin me-2"></i><span id="status-text">Initializing Camera...</span>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                <input type="email" id="email" required placeholder="JuanTamad@gmail.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
            </div>
            <button type="submit" class="w-full btn-primary text-white font-medium py-2.5 rounded-lg shadow-lg">
                Sign In
            </button>
        </form>

        <div id="camera-container" class="hidden text-center">
            <div class="relative w-full h-60 bg-black rounded-xl overflow-hidden border border-slate-200 shadow-inner mb-2">
                <video id="video" class="w-full h-full object-cover" autoplay muted playsinline></video>
            </div>
            <p class="text-xs text-slate-400">Position your face directly in front of your camera frame</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <script>
        const loginForm = document.getElementById('login-form');
        const cameraContainer = document.getElementById('camera-container');
        const errorBox = document.getElementById('error-box');
        const statusBox = document.getElementById('status-box');
        const statusText = document.getElementById('status-text');
        const video = document.getElementById('video');

        const tabPass = document.getElementById('tab-pass');
        const tabFace = document.getElementById('tab-face');

        let cameraStream = null;
        let runningInterval = null;
        let aiModelsReady = false;

        function switchMode(mode) {
            errorBox.classList.add('hidden');
            stopFaceAuth();

            if (mode === 'pass') {
                tabPass.className = "w-full py-2 rounded-lg text-indigo-600 bg-white shadow-sm";
                tabFace.className = "w-full py-2 rounded-lg text-slate-600 hover:text-slate-900";
                loginForm.classList.remove('hidden');
                cameraContainer.classList.add('hidden');
                statusBox.classList.add('hidden');
            } else {
                tabFace.className = "w-full py-2 rounded-lg text-indigo-600 bg-white shadow-sm";
                tabPass.className = "w-full py-2 rounded-lg text-slate-600 hover:text-slate-900";
                loginForm.classList.add('hidden');
                cameraContainer.classList.remove('hidden');
                startFaceAuth();
            }
        }

        // --- METHOD 1: Standard Credentials Handling ---
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            errorBox.classList.add('hidden');

            let userNode = getNodeMapping(emailInput);
            const url = `https://studentportal01-9ddef-default-rtdb.asia-southeast1.firebasedatabase.app/Users/${userNode}.json`;

            try {
                const response = await fetch(url);
                const userData = await response.json();
                verifyAndLogin(userData, passwordInput, emailInput, userNode);
            } catch (error) {
                showError("Error connecting to Firebase Realtime Database.");
            }
        });

        function getNodeMapping(email) {
            if (email === "admin@gmail.com") return "admin01";
            if (email === "rendell@gmail.com") return "student01";
            return "student_" + email.replace(/[\.@]/g, '_');
        }

        function verifyAndLogin(userData, typedPassword, email, node) {
            if (userData && userData.password === typedPassword) {
                localStorage.setItem('user_email', email);
                localStorage.setItem('user_name', userData['Full name'] || userData['name'] || "User");
                
                if (node.includes('admin')) {
                    localStorage.setItem('user_role', 'admin');
                    window.location.href = 'admin_dashboard.html';
                } else {
                    localStorage.setItem('user_role', 'student');
                    window.location.href = 'student_dashboard.html';
                }
            } else {
                showError("Invalid email or password.");
            }
        }

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.remove('hidden');
        }

        // --- METHOD 2: Continuous Face ID Tracking Engine ---
        async function startFaceAuth() {
            statusBox.classList.remove('hidden');
            statusText.innerText = "Loading AI models from CDN...";

            try {
                if (!aiModelsReady) {
                    // Points directly to the open-source CDN bypass URL
                    const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/weights/';
                    
                    await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                    aiModelsReady = true;
                }
            } catch (modelErr) {
                console.error(modelErr);
                statusBox.classList.add('hidden');
                showError("AI Models failed to load from CDN! Check internet connection or console.");
                return;
            }

            try {
                statusText.innerText = "Activating webcam lens...";
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: {} });
                video.srcObject = cameraStream;

                statusText.innerText = "Scanning facial landmarks...";
                runningInterval = setInterval(scanFrameAndMatch, 2500);

            } catch (camErr) {
                console.error(camErr);
                statusBox.classList.add('hidden');
                showError("Camera Access Denied! Please allow camera permissions in your browser settings.");
            }
        }

        async function scanFrameAndMatch() {
            const detection = await faceapi.detectSingleFace(video)
                .withFaceLandmarks()
                .withFaceDescriptor();

            if (!detection) return;

            const liveDescriptor = detection.descriptor;
            statusText.innerText = "Matching signatures...";

            try {
                const res = await fetch(`https://studentportal01-9ddef-default-rtdb.asia-southeast1.firebasedatabase.app/Users.json`);
                const allUsers = await res.json();

                if (!allUsers) return;

                for (const nodeKey in allUsers) {
                    const profile = allUsers[nodeKey];

                    if (profile && profile.face_descriptor) {
                        const savedDescriptorArray = new Float32Array(profile.face_descriptor.split(','));
                        const matchDistance = faceapi.euclideanDistance(liveDescriptor, savedDescriptorArray);

                        if (matchDistance < 0.55) {
                            statusText.innerText = "Access Granted! Loading session...";
                            statusBox.className = "bg-green-50 text-green-600 p-3 rounded-lg text-sm text-center mb-5 border border-green-100 font-bold";
                            
                            localStorage.setItem('user_email', profile.email || '');
                            localStorage.setItem('user_name', profile['Full name'] || profile['name'] || "User");
                            
                            stopFaceAuth();

                            if (nodeKey.includes('admin')) {
                                localStorage.setItem('user_role', 'admin');
                                window.location.href = 'admin_dashboard.html';
                            } else {
                                localStorage.setItem('user_role', 'student');
                                window.location.href = 'student_dashboard.html';
                            }
                            return;
                        }
                    }
                }
            } catch (err) {
                console.error("Database mismatch execution error: ", err);
            }
        }

        function stopFaceAuth() {
            if (runningInterval) { clearInterval(runningInterval); runningInterval = null; }
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            video.srcObject = null;
        }
    </script>
</body>
</html>
