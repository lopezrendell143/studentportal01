<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                linear-gradient(to bottom right, #f8fafc, #e2e8f0);
            background-attachment: fixed;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }
        button.btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%) !important;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100 auth-card">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Student Portal</h1>
            <p class="text-slate-500 mt-1">Sign in to your account</p>
        </div>

        <div class="flex p-1 bg-slate-100 rounded-xl mb-6 text-sm font-medium">
            <button id="tab-pass" class="w-full py-2 rounded-lg text-indigo-600 bg-white shadow-sm" onclick="switchMode('pass')">
                <i class="fas fa-keyboard me-1"></i> Password
            </button>
            <button id="tab-face" class="w-full py-2 rounded-lg text-slate-600 hover:text-slate-900" onclick="switchMode('face')">
                <i class="fas fa-user-shield me-1"></i> Face ID
            </button>
        </div>

        <div id="error-box" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center mb-5 border border-red-100"></div>
        <div id="status-box" class="hidden bg-indigo-50 text-indigo-600 p-3 rounded-lg text-sm text-center mb-5 border border-indigo-100">
            <i class="fas fa-circle-notch fa-spin me-2"></i><span id="status-text">Initializing Camera...</span>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                <input type="email" id="email" required placeholder="yourname@gmail.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 outline-none">
            </div>
            <button type="submit" class="w-full btn-primary text-white font-medium py-2.5 rounded-lg shadow-lg">Sign In</button>
        </form>

        <div id="camera-container" class="hidden text-center">
            <div class="relative w-full h-60 bg-black rounded-xl overflow-hidden border border-slate-200 mb-2">
                <video id="video" class="w-full h-full object-cover" autoplay muted playsinline></video>
            </div>
            <p class="text-xs text-slate-400">Position your face directly inside the camera window</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const cameraContainer = document.getElementById('camera-container');
        const errorBox = document.getElementById('error-box');
        const statusBox = document.getElementById('status-box');
        const statusText = document.getElementById('status-text');
        const video = document.getElementById('video');
        const tabPass = document.getElementById('tab-pass');
        const tabFace = document.getElementById('tab-face');

        let cameraStream = null;
        let runningInterval = null;
        let aiModelsReady = false;

        function switchMode(mode) {
            errorBox.classList.add('hidden');
            stopFaceAuth();
            if (mode === 'pass') {
                tabPass.className = "w-full py-2 rounded-lg text-indigo-600 bg-white shadow-sm";
                tabFace.className = "w-full py-2 rounded-lg text-slate-600 hover:text-slate-900";
                loginForm.classList.remove('hidden');
                cameraContainer.classList.add('hidden');
                statusBox.classList.add('hidden');
            } else {
                tabFace.className = "w-full py-2 rounded-lg text-indigo-600 bg-white shadow-sm";
                tabPass.className = "w-full py-2 rounded-lg text-slate-600 hover:text-slate-900";
                loginForm.classList.add('hidden');
                cameraContainer.classList.remove('hidden');
                startFaceAuth();
            }
        }

        // --- PASSWORD LOGIN LOGIC ---
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            errorBox.classList.add('hidden');

            let userNode = "student_" + emailInput.replace(/[\.@]/g, '_');
            if (emailInput === "admin@gmail.com") userNode = "admin01";
            if (emailInput === "rendell@gmail.com") userNode = "student01";

            const url = `https://studentportal-fc3a9-default-rtdb.asia-southeast1.firebasedatabase.app/Users/${userNode}.json`;

            try {
                const response = await fetch(url);
                const userData = await response.json();
                
                if (userData && userData.password === passwordInput) {
                    // IMPORTANT: Save the logged-in student's node identifier key for registration tracking
                    localStorage.setItem('user_node', userNode);
                    localStorage.setItem('user_email', emailInput);
                    localStorage.setItem('user_name', userData['Full name'] || userData['name'] || "Student");
                    
                    if (userNode.includes('admin')) {
                        localStorage.setItem('user_role', 'admin');
                        window.location.href = 'admin_dashboard.html';
                    } else {
                        localStorage.setItem('user_role', 'student');
                        window.location.href = 'student_dashboard.html';
                    }
                } else {
                    showError("Invalid email or password credentials.");
                }
            } catch (error) {
                showError("Error connecting to account servers.");
            }
        });

        // --- FACE ID LOGIN MATCHING ENGINE ---
        async function startFaceAuth() {
            statusBox.classList.remove('hidden');
            statusText.innerText = "Connecting to AI core structures...";
            const MODEL_URL = 'https://raw.githubusercontent.com/Neet-0/face-api-models/main/';

            try {
                if (!aiModelsReady) {
                    await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                    aiModelsReady = true;
                }
            } catch (err) {
                statusBox.classList.add('hidden');
                showError("Failed to initiate facial biometric files.");
                return;
            }

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = cameraStream;
                statusText.innerText = "Analyzing live camera feeds...";
                runningInterval = setInterval(scanAndMatch, 2000);
            } catch (err) {
                statusBox.classList.add('hidden');
                showError("Camera Access Blocked! Enable browser camera access.");
            }
        }

        async function scanAndMatch() {
            const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
            if (!detection) return;

            statusText.innerText = "Verifying biometric database records...";
            try {
                const res = await fetch(`https://studentportal-fc3a9-default-rtdb.asia-southeast1.firebasedatabase.app/Users.json`);
                const allUsers = await res.json();

                for (let key in allUsers) {
                    if (allUsers[key].face_descriptor) {
                        const savedWeights = new Float32Array(allUsers[key].face_descriptor.split(','));
                        const distance = faceapi.euclideanDistance(detection.descriptor, savedWeights);

                        if (distance < 0.55) {
                            statusText.innerText = "Access Approved! Redirecting...";
                            stopFaceAuth();
                            
                            localStorage.setItem('user_node', key);
                            localStorage.setItem('user_email', allUsers[key].email || '');
                            localStorage.setItem('user_name', allUsers[key]['Full name'] || allUsers[key]['name'] || "Student");
                            
                            if (key.includes('admin')) {
                                window.location.href = 'admin_dashboard.html';
                            } else {
                                window.location.href = 'student_dashboard.html';
                            }
                            return;
                        }
                    }
                }
            } catch (e) { console.error(e); }
        }

        function stopFaceAuth() {
            if (runningInterval) clearInterval(runningInterval);
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
            video.srcObject = null;
        }
        function showError(msg) { errorBox.textContent = msg; errorBox.classList.remove('hidden'); }
    </script>
</body>
</html>
