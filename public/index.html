<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Modern aesthetic enhancements using regular CSS */
        body {
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.18) 0px, transparent 55%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.18) 0px, transparent 55%),
                linear-gradient(to bottom right, #f1f5f9, #e2e8f0);
            background-attachment: fixed;
        }

        /* Glassmorphism card refinement */
        .auth-card {
            background: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.7) !important;
            box-shadow: 
                0 4px 30px rgba(0, 0, 0, 0.03),
                0 20px 25px -5px rgba(0, 0, 0, 0.05),
                inset 0 0 0 1px rgba(255, 255, 255, 0.6);
        }

        /* Header Accent */
        .portal-header::before {
            content: "🎓";
            display: block;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 8px 12px rgba(99, 102, 241, 0.3));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* Form input enhancements */
        input[type="email"], input[type="password"] {
            background-color: rgba(248, 250, 252, 0.6) !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        input[type="email"]:focus, input[type="password"]:focus {
            background-color: #ffffff !important;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15) !important;
            transform: translateY(-1px);
        }

        /* Button micro-interactions */
        button[type="submit"] {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3) !important;
        }

        button[type="submit"]:hover {
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4) !important;
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        button[type="submit"]:active {
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(99, 102, 241, 0.2) !important;
        }

        /* Labels styling */
        label {
            font-size: 0.75rem !important;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            font-weight: 700 !important;
            color: #64748b !important;
        }

        /* Error box attention grabber */
        #error-box {
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.1);
        }

        @keyframes slideIn {
            from { transform: translateY(-8px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md border border-slate-100 auth-card transition-all duration-300">
        <div class="text-center mb-8 portal-header">
            <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 bg-clip-text text-transparent">Student Portal</h1>
            <p class="text-slate-400 font-medium mt-1.5 text-sm">Sign in to access your dashboard</p>
        </div>

        <div class="flex p-1.5 bg-slate-200/60 backdrop-blur-md rounded-2xl mb-6 text-sm font-semibold border border-slate-200/40">
            <button id="tab-pass" class="w-full py-2.5 rounded-xl text-indigo-600 bg-white shadow-sm transition-all duration-200 flex items-center justify-center gap-2" onclick="switchMode('pass')">
                <i class="fas fa-keyboard text-xs"></i> Password
            </button>
            <button id="tab-face" class="w-full py-2.5 rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200 flex items-center justify-center gap-2" onclick="switchMode('face')">
                <i class="fas fa-user-shield text-xs"></i> Face ID
            </button>
        </div>

        <div id="error-box" class="hidden bg-red-50 text-red-600 p-3.5 rounded-xl text-sm text-center mb-5 border border-red-100 font-medium"></div>
        
        <div id="status-box" class="hidden bg-indigo-50 text-indigo-600 p-3.5 rounded-xl text-sm text-center mb-5 border border-indigo-100 font-medium">
            <i class="fas fa-circle-notch fa-spin me-2"></i><span id="status-text">Loading Face ID Engine...</span>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block mb-1.5">Email Address</label>
                <input type="email" id="email" required placeholder="JuanTamad@gmail.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-300 text-slate-700">
            </div>
            <div>
                <label class="block mb-1.5">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-300 text-slate-700">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-all tracking-wide text-sm">
                Sign In
            </button>
        </form>

        <div id="camera-container" class="hidden text-center transition-all duration-300">
            <div class="relative w-full h-64 bg-slate-950 rounded-2xl overflow-hidden border-2 border-indigo-500/30 shadow-2xl mb-4 group">
                <video id="video" class="w-full h-full object-cover scale-x-[-1]" autoplay muted playsinline></video>
                <div class="absolute inset-0 border-2 border-dashed border-indigo-400/40 m-6 rounded-xl pointer-events-none box-border animate-pulse"></div>
            </div>
            <p class="text-xs font-medium text-slate-400 flex items-center justify-center gap-1.5">
                <i class="fas fa-info-circle text-indigo-400"></i> Center your face inside the frame
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const cameraContainer = document.getElementById('camera-container');
        const errorBox = document.getElementById('error-box');
        const statusBox = document.getElementById('status-box');
        const statusText = document.getElementById('status-text');
        const video = document.getElementById('video');
        const tabPass = document.getElementById('tab-pass');
        const tabFace = document.getElementById('tab-face');

        let cameraStream = null;
        let detectionInterval = null;
        let modelsLoaded = false;

        // Handles swapping elements when shifting between Password forms and Camera views
        function switchMode(mode) {
            errorBox.classList.add('hidden');
            stopFaceAuthentication();
            
            if (mode === 'pass') {
                tabPass.className = "w-full py-2.5 rounded-xl text-indigo-600 bg-white shadow-sm transition-all duration-200 flex items-center justify-center gap-2";
                tabFace.className = "w-full py-2.5 rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200 flex items-center justify-center gap-2";
                loginForm.classList.remove('hidden');
                cameraContainer.classList.add('hidden');
                statusBox.classList.add('hidden');
            } else {
                tabFace.className = "w-full py-2.5 rounded-xl text-indigo-600 bg-white shadow-sm transition-all duration-200 flex items-center justify-center gap-2";
                tabPass.className = "w-full py-2.5 rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200 flex items-center justify-center gap-2";
                loginForm.classList.add('hidden');
                cameraContainer.classList.remove('hidden');
                startFaceAuthentication();
            }
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            
            errorBox.classList.add('hidden');

            // Determine the Firebase key mapping
            let userNode = "";
            if (emailInput === "admin@gmail.com") {
                userNode = "admin01";
            } else if (emailInput === "rendell@gmail.com") {
                userNode = "student01";
            } else {
                // Matches the auto-generated structure for newly created students
                userNode = "student_" + emailInput.replace(/[\.@]/g, '_');
            }

            // Your exact Singapore database URL targeting the specific node
            const url = `https://studentportal01-9ddef-default-rtdb.asia-southeast1.firebasedatabase.app/Users/${userNode}.json`;

            try {
                const response = await fetch(url);
                const userData = await response.json();

                if (userData && userData.password === passwordInput) {
                    // ADDED: Saves user_node details to handle dashboard profile linking checks
                    localStorage.setItem('user_node', userNode);
                    // Store user session variables locally in the browser
                    localStorage.setItem('user_email', emailInput);
                    localStorage.setItem('user_name', userData['Full name'] || userData['name'] || "User");
                    
                    // Route user roles based on node signature
                    if (userNode.includes('admin')) {
                        localStorage.setItem('user_role', 'admin');
                        window.location.href = 'admin_dashboard.html';
                    } else {
                        localStorage.setItem('user_role', 'student');
                        window.location.href = 'student_dashboard.html';
                    }
                } else {
                    errorBox.textContent = "Invalid email or password.";
                    errorBox.classList.remove('hidden');
                }
            } catch (error) {
                errorBox.textContent = "Error connecting to Firebase Realtime Database.";
                errorBox.classList.remove('hidden');
                console.error(error);
            }
        });

        // --- ADDED: BIOMETRIC RECOGNITION LOOPS ---
        async function startFaceAuthentication() {
            statusBox.classList.remove('hidden');
            statusText.innerText = "Loading AI models from CDN network...";
            
            const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models/';

            try {
                if (!modelsLoaded) {
                    await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                    modelsLoaded = true;
                }
            } catch (err) {
                statusBox.classList.add('hidden');
                showErrorText("AI models failed to configure. Check system console.");
                return;
            }

            try {
                statusText.innerText = "Starting hardware camera...";
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = cameraStream;
                statusText.innerText = "Scanning facial biometrics...";
                
                detectionInterval = setInterval(executeBiometricVerification, 2000);
            } catch (err) {
                statusBox.classList.add('hidden');
                showErrorText("Camera access blocked. Reset browser privacy permissions.");
            }
        }

        async function executeBiometricVerification() {
            const liveDetection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
            if (!liveDetection) return;

            statusText.innerText = "Matching records...";
            
            try {
                const res = await fetch(`https://studentportal01-9ddef-default-rtdb.asia-southeast1.firebasedatabase.app/Users.json`);
                const allUsers = await res.json();

                for (let uniqueNodeKey in allUsers) {
                    const userProfile = allUsers[uniqueNodeKey];
                    
                    if (userProfile && userProfile.face_descriptor) {
                        const savedDescriptorWeights = new Float32Array(userProfile.face_descriptor.split(','));
                        const distance = faceapi.euclideanDistance(liveDetection.descriptor, savedDescriptorWeights);

                        if (distance < 0.55) {
                            statusText.innerText = "Access Approved! Redirecting...";
                            stopFaceAuthentication();
                            
                            localStorage.setItem('user_node', uniqueNodeKey);
                            localStorage.setItem('user_email', userProfile.email || '');
                            localStorage.setItem('user_name', userProfile['Full name'] || userProfile['name'] || "User");
                            
                            if (uniqueNodeKey.includes('admin')) {
                                localStorage.setItem('user_role', 'admin');
                                window.location.href = 'admin_dashboard.html';
                            } else {
                                localStorage.setItem('user_role', 'student');
                                window.location.href = 'student_dashboard.html';
                            }
                            return;
                        }
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        function stopFaceAuthentication() {
            if (detectionInterval) clearInterval(detectionInterval);
            if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }

        function showErrorText(msg) {
            errorBox.textContent = msg;
            errorBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
