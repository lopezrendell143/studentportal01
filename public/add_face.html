<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Setup Face ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                linear-gradient(to bottom right, #f8fafc, #e2e8f0);
            background-attachment: fixed;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100 auth-card text-center">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Setup Face ID</h1>
            <p class="text-slate-500 text-sm mt-1">Link your face for quick account login</p>
        </div>

        <div id="error-box" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center mb-4 border border-red-100"></div>
        <div id="status-box" class="bg-indigo-50 text-indigo-600 p-3 rounded-lg text-sm text-center mb-4 border border-indigo-100">
            <i class="fas fa-circle-notch fa-spin me-2"></i><span id="status-text">Loading Face ID Systems...</span>
        </div>

        <div class="relative w-full h-64 bg-black rounded-xl overflow-hidden border border-slate-200 mb-4">
            <video id="video" class="w-full h-full object-cover" autoplay muted playsinline></video>
        </div>

        <button id="registerBtn" disabled class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-medium py-2.5 rounded-lg transition-colors shadow-lg shadow-indigo-100">
            Register My Face
        </button>

        <div class="mt-6 border-t border-slate-200 pt-4">
            <a href="student_dashboard.html" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium flex items-center justify-center gap-1">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="add_face.js"></script>
</body>
</html>
