<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Admin - Dashboard Overview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Modern, clean sliding animation for the mobile navigation drawer */
        @media (max-width: 767px) {
            .mobile-sidebar {
                transform: translateX(-100%);
                transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .mobile-sidebar.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex overflow-hidden">

    <script>if (localStorage.getItem('user_role') !== 'admin') { window.location.href = 'index.html'; }</script>

    <aside id="sidebar" class="w-64 bg-[#2d323f] text-slate-200 p-6 flex flex-col justify-between shrink-0 h-screen fixed md:sticky top-0 left-0 shadow-2xl z-50 mobile-sidebar md:transform-none">
        <div>
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-sm font-bold tracking-wider text-slate-400 uppercase md:block hidden">🛡️ Portal Admin</h2>
                <button onclick="toggleSidebar()" class="md:hidden ml-auto text-slate-400 hover:text-white text-xl p-1 outline-none">
                    ✕
                </button>
            </div>
            
            <nav class="space-y-4">
                <a href="admin_dashboard.html" class="flex items-center gap-4 text-[15px] font-semibold text-white tracking-wide border-l-2 border-indigo-500 pl-2 -ml-2">
                    <span class="text-lg">📊</span> Overview
                </a>
                <a href="add_student.html" class="flex items-center gap-4 text-[15px] font-semibold text-slate-400 hover:text-white tracking-wide transition-colors">
                    <span class="text-lg text-slate-400">👤</span> Add Student
                </a>
                <a href="manage_exams.html" class="flex items-center gap-4 text-[15px] font-semibold text-slate-400 hover:text-white tracking-wide transition-colors">
                    <span class="text-lg text-slate-400">📝</span> Manage Exams
                </a>
            </nav>
        </div>
        
        <button onclick="logout()" class="w-full text-center bg-red-600/10 hover:bg-red-600 text-red-400 hover:text-white font-medium py-2 rounded-xl text-sm transition-all block border border-red-500/10">
            Log Out
        </button>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto h-screen">
        <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="md:hidden flex flex-col justify-between w-5 h-3.5 outline-none opacity-70 hover:opacity-100 transition-opacity">
                    <span class="w-full h-0.5 bg-slate-800 rounded"></span>
                    <span class="w-full h-0.5 bg-slate-800 rounded"></span>
                    <span class="w-full h-0.5 bg-slate-800 rounded"></span>
                </button>
                <h1 class="text-2xl font-bold text-slate-800">Admin Central Hub</h1>
            </div>
            <span class="text-sm font-medium text-slate-600">Active User: <strong id="admin-display-name">Admin</strong></span>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
                <div>
                    <p class="text-xs font-bold uppercase text-slate-400 tracking-wider">Registered Users</p>
                    <h3 class="text-3xl font-extrabold text-slate-800 mt-1" id="stat-users">0</h3>
                </div>
                <div class="p-3 rounded-xl bg-indigo-50 text-indigo-600 font-bold text-xl">👥</div>
            </div>
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
                <div>
                    <p class="text-xs font-bold uppercase text-slate-400 tracking-wider">Active Exams Deployed</p>
                    <h3 class="text-3xl font-extrabold text-slate-800 mt-1" id="stat-exams">0</h3>
                </div>
                <div class="p-3 rounded-xl bg-emerald-50 text-emerald-600 font-bold text-xl">📝</div>
            </div>
        </div>

        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8">
            <h3 class="text-lg font-bold text-indigo-600 mb-4">Recent Exam Submissions</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-400 text-xs font-bold uppercase tracking-wider">
                            <th class="pb-3">Student</th>
                            <th class="pb-3">Exam</th>
                            <th class="pb-3">Score</th>
                            <th class="pb-3">Status</th>
                            <th class="pb-3">Date</th>
                        </tr>
                    </thead>
                    <tbody id="submissions-table-body" class="text-slate-600 text-sm divide-y divide-slate-100">
                        <tr><td colspan="5" class="py-4 text-center text-slate-400">Syncing submission logs...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Live User Accounts</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-400 text-sm font-medium">
                            <th class="pb-3">Node ID</th>
                            <th class="pb-3">Full Name Field</th>
                            <th class="pb-3">Email Identity</th>
                            <th class="pb-3">Role</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="text-slate-600 text-sm divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        document.getElementById('admin-display-name').textContent = localStorage.getItem('user_name') || 'Admin';
        const databaseRoot = "https://studentportal01-9ddef-default-rtdb.asia-southeast1.firebasedatabase.app";

        // Toggle visibility state for mobile side panel view
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function initDashboardData() {
            try {
                const [resUsers, resExams, resResults] = await Promise.all([
                    fetch(`${databaseRoot}/Users.json`),
                    fetch(`${databaseRoot}/Exams.json`),
                    fetch(`${databaseRoot}/Results.json`)
                ]);

                const users = await resUsers.json() || {};
                const exams = await resExams.json() || {};
                const results = await resResults.json() || {};

                document.getElementById('stat-users').textContent = Object.keys(users).length;
                document.getElementById('stat-exams').textContent = Object.keys(exams).length;

                const subBody = document.getElementById('submissions-table-body');
                subBody.innerHTML = '';
                
                if (Object.keys(results).length > 0) {
                    for (const [key, record] of Object.entries(results)) {
                        const statusClass = record.status === "PASSED" 
                            ? "bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded text-xs font-bold" 
                            : "bg-red-100 text-red-700 px-2.5 py-0.5 rounded text-xs font-bold";

                        subBody.innerHTML += `
                            <tr>
                                <td class="py-3.5 font-medium text-slate-800">${record.student_name}</td>
                                <td class="py-3.5 text-slate-500">${record.exam_title}</td>
                                <td class="py-3.5 font-bold text-slate-800">${record.score_raw}/${record.total_questions}</td>
                                <td class="py-3.5"><span class="${statusClass}">${record.status}</span></td>
                                <td class="py-3.5 text-slate-400 text-xs">${record.submitted_at || 'Recent'}</td>
                            </tr>
                        `;
                    }
                } else {
                    subBody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-400">No student attempts recorded yet.</td></tr>`;
                }

                const userBody = document.getElementById('users-table-body');
                userBody.innerHTML = '';
                
                for (const [nodeId, info] of Object.entries(users)) {
                    const isAdmin = info.role === 'admin';
                    const rowClass = isAdmin ? "bg-amber-50" : ""; 
                    
                    userBody.innerHTML += `
                        <tr class="${rowClass}">
                            <td class="py-3.5 font-mono text-xs font-semibold text-indigo-600">${nodeId}</td>
                            <td class="py-3.5 font-medium text-slate-800">${info['Full name'] || info['name'] || 'N/A'}</td>
                            <td class="py-3.5 text-slate-500">${info.email || 'N/A'}</td>
                            <td class="py-3.5 text-xs font-bold uppercase tracking-wider ${isAdmin ? 'text-amber-600' : 'text-slate-400'}">
                                ${info.role || 'student'}
                            </td>
                        </tr>
                    `;
                }
            } catch (e) { console.error("Database connection fault:", e); }
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        initDashboardData();
    </script>
</body>
</html>
