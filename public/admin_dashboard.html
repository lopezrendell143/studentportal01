<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex">

    <script>
        if (localStorage.getItem('user_role') !== 'admin') {
            window.location.href = 'index.html';
        }
    </script>

    <aside class="w-64 bg-slate-900 text-white p-6 flex flex-col justify-between hidden md:flex">
        <div>
            <h2 class="text-xl font-bold tracking-wider mb-8 text-indigo-400">PORTAL ADMIN</h2>
            <nav class="space-y-2">
                <a href="#" class="block bg-slate-800 px-4 py-2.5 rounded-lg font-medium text-white">Overview</a>
            </nav>
        </div>
        <button onclick="logout()" class="w-full text-center bg-red-600/25 hover:bg-red-600 text-red-400 hover:text-white font-medium py-2 rounded-lg transition-colors block">
            Log Out
        </button>
    </aside>

    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-800">Admin Control Panel</h1>
            <span class="text-sm font-medium text-slate-600">Logged in as: <strong id="admin-display-name">Admin</strong></span>
        </header>

        <div id="alert-box" class="hidden p-4 rounded-xl text-sm mb-6 border"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
                <h3 class="text-lg font-bold text-slate-800 mb-4">Create Student Account</h3>
                <form id="create-student-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Full Name</label>
                        <input type="text" id="student-name" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm outline-none focus:border-indigo-500" placeholder="Jane Doe">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Email Address</label>
                        <input type="email" id="student-email" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm outline-none focus:border-indigo-500" placeholder="jane@gmail.com">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Account Password</label>
                        <input type="password" id="student-password" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm outline-none focus:border-indigo-500" placeholder="password123">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition-colors shadow-md">
                        Save Account to Firebase
                    </button>
                </form>
            </section>

            <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 lg:col-span-2">
                <h3 class="text-lg font-bold text-slate-800 mb-4">Live Firebase Accounts (`/Users`)</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 text-slate-400 text-sm font-medium">
                                <th class="pb-3">Node Key</th>
                                <th class="pb-3">Full Name Field</th>
                                <th class="pb-3">Email</th>
                                <th class="pb-3">Password</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body" class="text-slate-600 text-sm divide-y divide-slate-100">
                            </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script>
        document.getElementById('admin-display-name').textContent = localStorage.getItem('user_name') || 'Admin';
        const baseUrl = "https://studentportal01-9ddef-default-rtdb.asia-southeast1.firebasedatabase.app/Users.json";

        // Fetch and load database directory records
        async function loadAccounts() {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-400">Loading live user database...</td></tr>`;
            
            try {
                const response = await fetch(baseUrl);
                const users = await response.json();
                tbody.innerHTML = '';

                if (users) {
                    for (const [nodeId, info] of Object.entries(users)) {
                        let displayEmail = info.email ? info.email : 'N/A';
                        if (!displayEmail.includes('@') && displayEmail !== 'N/A') {
                            displayEmail += '@gmail.com';
                        }

                        tbody.innerHTML += `
                            <tr>
                                <td class="py-3 font-mono text-xs font-semibold text-indigo-600">${nodeId}</td>
                                <td class="py-3 text-slate-800">${info['Full name'] || info['name'] || 'N/A'}</td>
                                <td class="py-3">${displayEmail}</td>
                                <td class="py-3 font-mono text-xs text-slate-400">${info.password || 'N/A'}</td>
                            </tr>
                        `;
                    }
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-400">No records found.</td></tr>`;
                }
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-red-500">Error fetching from Firebase.</td></tr>`;
            }
        }

        // Automatic Account Registration sync handler
        document.getElementById('create-student-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('student-name').value.trim();
            const email = document.getElementById('student-email').value.trim();
            const password = document.getElementById('student-password').value.trim();
            const alertBox = document.getElementById('alert-box');

            const customNodeId = "student_" + email.replace(/[\.@]/g, '_');
            const targetUrl = `https://studentportal01-9ddef-default-rtdb.asia-southeast1.firebasedatabase.app/Users/${customNodeId}.json`;

            const payload = {
                "Full name": name,
                "email": email.replace('@gmail.com', ''),
                "password": password
            };

            try {
                const response = await fetch(targetUrl, {
                    method: 'PUT',
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alertBox.className = "bg-emerald-50 text-emerald-600 p-4 rounded-xl text-sm mb-6 border border-emerald-100";
                    alertBox.textContent = "Account completely created and synced to Firebase in real time!";
                    alertBox.classList.remove('hidden');
                    document.getElementById('create-student-form').reset();
                    loadAccounts(); // Triggers direct table update
                } else {
                    throw new Error();
                }
            } catch (error) {
                alertBox.className = "bg-red-50 text-red-600 p-4 rounded-xl text-sm mb-6 border border-red-100";
                alertBox.textContent = "Failed to sync account data with Firebase Cloud.";
                alertBox.classList.remove('hidden');
            }
        }); // <-- Fixed missing closing block token context

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // Run data compilation layout immediately on runtime window startup
        loadAccounts();
    </script>
</body>
</html>
